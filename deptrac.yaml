deptrac:
  cache_file: .tmp/deptrac.cache

  paths:
    - ./src/php

  layers:
    - name: KernelContainer
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Kernel\\Container\\.+$

    - name: Kernel
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Kernel\\(?!Container\\|Ports\\).+$

    - name: KernelPorts
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Kernel\\Ports\\.+$

    - name: Domain
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Components\\[^\\]+\\Domain\\.+$

    - name: InfrastructureShared
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Infrastructure\\(Ports\\.+|Logger|EventBus\\ApplicationEventConsumerInterface)$

    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Infrastructure\\(?!Ports\\|Logger$|EventBus\\ApplicationEventConsumerInterface$).+$

    - name: Presentation
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Presentation\\.+$

    - name: Integration
      collectors:
        - type: classLike
          value: ^Fundrik\\WordPress\\Integration\\.+$

    - name: IntegrationFunctions
      collectors:
        - type: functionName
          value: ^fundrik_(get|the)_.+$

    - name: CoreDomain
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Domain\\.+$

    - name: CoreApplicationPorts
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Application\\Ports\\.+$

    - name: CoreApplication
      collectors:
        - type: classLike
          value: ^Fundrik\\Core\\Components\\[^\\]+\\Application\\(?!Ports\\).+$

    - name: Toolbox
      collectors:
        - type: classLike
          value: ^Fundrik\\Toolbox\\.+$

    - name: LaravelContainer
      collectors:
        - type: classLike
          value: ^Illuminate\\(Container|Contracts\\Container)\\.+$

    - name: PsrLogger
      collectors:
        - type: classLike
          value: ^Psr\\Log\\.+$

    - name: YooKassaSdk
      collectors:
        - type: classLike
          value: ^YooKassa\\.+$

    - name: WordPressClasses
      collectors:
        - type: classLike
          value: ^(WP_.+|wpdb)$

  ruleset:
    KernelContainer:
      - KernelPorts
      - InfrastructureShared
      - Infrastructure
      - Integration
      - CoreApplicationPorts
      - LaravelContainer
      - PsrLogger

    Kernel:
      - KernelPorts

    Domain:
      - CoreDomain

    Infrastructure:
      - InfrastructureShared
      - KernelPorts
      - Domain
      - CoreDomain
      - CoreApplication
      - CoreApplicationPorts
      - Toolbox
      - PsrLogger

    # TODO: Should PsrLogger be allowed only in InfrastructureShared?
    InfrastructureShared:
      - CoreApplication
      - PsrLogger

    Presentation:
      - Toolbox

    Integration:
      - KernelPorts
      - Domain
      - InfrastructureShared
      - Presentation
      - CoreDomain
      - CoreApplication
      - CoreApplicationPorts
      - Toolbox
      - PsrLogger
      - YooKassaSdk
      - WordPressClasses

    IntegrationFunctions:
      - Integration
      - KernelContainer
